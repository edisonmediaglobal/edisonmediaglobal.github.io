<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para mi Dannita 💛</title>

    <!-- CONEXIÓN CON EL CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ==========================================
         FONDO ANIMADO
    =========================================== -->

    <div id="estrellas"></div>
    <div id="mensajes"></div>
    <div id="particulas"></div>

    <div class="luz-fondo"></div>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    =========================================== -->

    <main class="contenido">


        <!-- MENSAJE PRINCIPAL -->

        <section class="titulo">

            <div class="corazon-superior">
                💛
            </div>

            <h1>
                PARA TI MI DANNITA HERMOSA
            </h1>

            <p>
                Un pequeño detalle hecho especialmente para ti
                🌻✨
            </p>

        </section>


        <!-- ======================================
             RAMO DE FLORES
        ======================================= -->

        <section class="zona-ramo">

            <div class="ramo" id="ramo">


                <!-- TALLOS -->

                <div
                    class="tallo"
                    style="transform: rotate(-30deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(-22deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(-14deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(-7deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(0deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(8deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(16deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(24deg);"
                ></div>

                <div
                    class="tallo"
                    style="transform: rotate(31deg);"
                ></div>


                <!-- HOJAS -->

                <div
                    class="hoja"
                    style="
                        left: 105px;
                        bottom: 285px;
                        transform: rotate(20deg);
                    "
                ></div>

                <div
                    class="hoja"
                    style="
                        left: 265px;
                        bottom: 290px;
                        transform: rotate(120deg);
                    "
                ></div>

                <div
                    class="hoja"
                    style="
                        left: 125px;
                        bottom: 225px;
                        transform: rotate(5deg);
                    "
                ></div>

                <div
                    class="hoja"
                    style="
                        left: 270px;
                        bottom: 225px;
                        transform: rotate(135deg);
                    "
                ></div>

                <div
                    class="hoja"
                    style="
                        left: 150px;
                        bottom: 350px;
                        transform: rotate(35deg);
                    "
                ></div>

                <div
                    class="hoja"
                    style="
                        left: 235px;
                        bottom: 350px;
                        transform: rotate(105deg);
                    "
                ></div>


                <!-- ENVOLTURA -->

                <div class="envoltura"></div>


                <!-- ==================================
                     CARTITA
                =================================== -->

                <div class="tarjeta">


                    <!-- ==============================
                         AQUÍ ESTÁ LA FOTO DE DANNITA
                    =============================== -->

                    <div class="marco-foto">

                        <img
                            src="Dannita.jpg.jpeg"
                            alt="Dannita"
                            class="foto-dannita"
                        >

                        <div class="corazon-foto">
                            💛
                        </div>

                    </div>


                    <!-- TEXTO DE LA CARTITA -->

                    <h3>
                        Para mi
                        <span>Dannita hermosa</span>
                        🌻
                    </h3>


                    <p>
                        Eres alguien muy especial para mí.
                    </p>

                    <p>
                        Gracias por hacer mis días
                        mucho más bonitos.
                    </p>


                    <div class="decoracion-tarjeta">
                        💛 🌻 ✨ 🌻 💛
                    </div>

                </div>


                <!-- LAZO -->

                <div class="lazo"></div>

            </div>

        </section>


        <!-- ======================================
             MENSAJE FINAL
        ======================================= -->

        <section class="mensaje-final">

            <h2>
                💛 TE AMO MI PRINCESA HERMOSA 💛
            </h2>

            <p>
                🌻 ✨ Siempre tú, mi Dannita ✨ 🌻
            </p>

        </section>


    </main>


    <!-- CONEXIÓN CON JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
